name: Build and Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.0.0" "twine>=5.1.1"

      - name: Build package
        run: |
          python -m build

      - name: Check package metadata
        run: |
          echo "🔍 Checking generated package metadata..."
          python -c "
          import zipfile
          import glob
          
          whl_files = glob.glob('dist/*.whl')
          if not whl_files:
              print('❌ No wheel file found')
              exit(1)
          
          whl_file = whl_files[0]
          print(f'📦 Checking: {whl_file}')
          
          z = zipfile.ZipFile(whl_file)
          metadata_files = [f for f in z.namelist() if f.endswith('/METADATA')]
          
          if not metadata_files:
              print('❌ No METADATA file found in wheel')
              exit(1)
          
          content = z.read(metadata_files[0]).decode()
          lines = content.split('\n')[:10]
          print('\n'.join(lines))
          "

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "twine>=5.1.1"
          shopt -s nullglob
          artifacts=(dist/*.tar.gz dist/*.whl)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "❌ No distribution artifacts found in dist/" >&2
            exit 1
          fi
          echo "📦 Found artifacts: ${artifacts[@]}"
          python -m twine check "${artifacts[@]}"
          python -m twine upload "${artifacts[@]}"
